<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link href="./css/style.css" rel="stylesheet" />
    <script src="./main.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div class="calculator">
        <div class="screen-container">
          <div class="screen-top-row"></div>
          <div class="screen-bottom-row"></div>
        </div>
        <div class="button-container">
          <div class="button-row">
            <button class="button misc" id="backspace" type="button">
              <svg
                id="backspace-icon"
                xmlns="http://www.w3.org/2000/svg"
                height="40px"
                viewBox="-80 -1170 1200 1200"
                width="40px"
                fill="#2d342c"
              >
                <path
                  d="M450.67-324 560-433.33 669.33-324l47.34-47.33-110-108.67 108.66-108.67L668-636 560-526.67 450.67-636l-47.34 47.33 110 108.67-110 108.67L450.67-324Zm-97.34 164q-15.83 0-30-7.08-14.16-7.09-23.33-19.59L80-480l219.33-293.33q9.17-12.5 23.34-19.59 14.16-7.08 30-7.08H814q27.5 0 47.08 19.58 19.59 19.59 19.59 47.09v506.66q0 27.5-19.59 47.09Q841.5-160 814-160H353.33Zm-190-320 190 253.33H814v-506.66H353.33L163.33-480ZM584-480Z"
                  stroke="#2d342c"
                  stroke-width="16"
                />
              </svg>
            </button>
            <button class="button misc" id="all-clear" type="button">AC</button>
            <button class="button misc" id="pop-btn" type="button">POP</button>
            <button class="button operator" id="divide" type="button">
              &divide;
            </button>
          </div>
          <div class="button-row">
            <button class="button digit" id="seven" type="button">7</button>
            <button class="button digit" id="eight" type="button">8</button>
            <button class="button digit" id="nine" type="button">9</button>
            <button class="button operator" id="multiply" type="button">
              &times;
            </button>
          </div>
          <div class="button-row">
            <button class="button digit" id="four" type="button">4</button>
            <button class="button digit" id="five" type="button">5</button>
            <button class="button digit" id="six" type="button">6</button>
            <button class="button operator" id="minus" type="button">
              &minus;
            </button>
          </div>
          <div class="button-row">
            <button class="button digit" id="one" type="button">1</button>
            <button class="button digit" id="two" type="button">2</button>
            <button class="button digit" id="three" type="button">3</button>
            <button class="button operator" id="plus" type="button">
              &plus;
            </button>
          </div>
          <div class="button-row">
            <button class="button digit" id="zero" type="button">0</button>
            <button class="button digit" id="point" type="button">.</button>
            <button class="button" id="equals" type="button">=</button>
          </div>
        </div>
      </div>
      <footer class="footer">
        <div class="signature">
          <p>kristijanxo</p>
          <a
            href="https://github.com/kristijanxo"
            target="_blank"
            rel="noopener noreferer"
          >
            <img class="github-logo" src="img/github-logo.svg" />
          </a>
        </div>
      </footer>
    </div>
  </body>
</html>
